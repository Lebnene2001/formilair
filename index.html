<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscription – Semaine d’orientation post-Bac</title>
  <meta name="description" content="Inscrivez-vous à la Semaine d’orientation post-Bac et recevez votre ticket d’accès avec QR code.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page">

  <section id="formView" class="card">
    <header class="head">
      <h1>Semaine d’orientation post-Bac</h1>
      <p id="eventDateText" class="sub"></p>
    </header>

    <form id="inscriptionForm" novalidate>
      <div class="field">
        <label for="prenom">Prénom</label>
        <input id="prenom" name="prenom" type="text" autocomplete="given-name" maxlength="60" required>
        <p class="err" data-for="prenom"></p>
      </div>
      <div class="field">
        <label for="nom">Nom</label>
        <input id="nom" name="nom" type="text" autocomplete="family-name" maxlength="60" required>
        <p class="err" data-for="nom"></p>
      </div>
      <div class="field">
        <label for="telephone">Numéro de téléphone</label>
        <input id="telephone" name="telephone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="+227 90 00 00 00" required>
        <p class="err" data-for="telephone"></p>
      </div>
      <div class="field">
        <label for="serie">Série du Bac</label>
        <select id="serie" name="serie" required>
          <option value="">Choisir…</option>
          <option>A</option><option>C</option><option>D</option><option>E</option>
          <option>F</option><option>G</option><option>Autre</option>
        </select>
        <p class="err" data-for="serie"></p>
      </div>
      <div class="field">
        <label for="etudes">Souhaitez-vous continuer vos études à l’étranger ?</label>
        <select id="etudes" name="etudes" required>
          <option value="">Choisir…</option><option>Oui</option><option>Non</option><option>Peut-être</option>
        </select>
        <p class="err" data-for="etudes"></p>
      </div>
      <div class="field">
        <label for="universite">Préférez-vous une université publique ou privée ?</label>
        <select id="universite" name="universite" required>
          <option value="">Choisir…</option><option>Publique</option><option>Privée</option><option>Peu importe</option>
        </select>
        <p class="err" data-for="universite"></p>
      </div>
      <div class="field">
        <label for="bourse">Avez-vous besoin d’une bourse pour poursuivre vos études ?</label>
        <select id="bourse" name="bourse" required>
          <option value="">Choisir…</option><option>Oui</option><option>Non</option><option>Peut-être</option>
        </select>
        <p class="err" data-for="bourse"></p>
      </div>

      <!-- Champ piège anti-robots : doit rester vide -->
      <div class="trap" aria-hidden="true">
        <label for="site">Ne pas remplir</label>
        <input id="site" name="site" type="text" tabindex="-1" autocomplete="off">
      </div>

      <p id="formError" class="err form-err" role="alert"></p>
      <button id="submitBtn" type="submit" class="btn">Obtenir mon ticket</button>
    </form>
  </section>

  <section id="ticketView" class="card" hidden>
    <p id="confirmation" class="ok" tabindex="-1"></p>
    <canvas id="ticketCanvas" width="1000" height="360" role="img" aria-label="Votre ticket d’accès"></canvas>
    <p id="offlineNote" class="note" hidden>Inscription non enregistrée : l’envoi au serveur n’est pas configuré. Gardez votre ticket.</p>
    <div class="actions">
      <button type="button" id="downloadBtn" class="btn">Télécharger le ticket</button>
      <a id="whatsappLink" class="btn ghost" target="_blank" rel="noopener noreferrer">Envoyer sur WhatsApp</a>
      <button type="button" id="retourBtn" class="btn ghost">Nouvelle inscription</button>
    </div>
  </section>

</main>
<script src="qrcode.js"></script>
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
